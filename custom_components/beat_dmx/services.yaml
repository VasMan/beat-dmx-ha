set_channel:
  fields:
    fixture:
      required: true
      example: light.left_beam_ch
      selector:
        text:
    channel:
      required: true
      selector:
        number:
          min: 1
          max: 11
    value:
      required: true
      selector:
        number:
          min: 0
          max: 255
calibrate:
  fields:
    fixture:
      required: true
      example: light.left_beam_ch
      selector:
        text:
    point:
      required: true
      selector:
        select:
          options:
            - up
            - level
            - reverse_pan
            - reset
            - go_up
            - go_level
            - go_left
analyse_folder:
  fields:
    folder:
      example: /media/Music
      selector:
        text:
    full:
      default: false
      selector:
        boolean:
